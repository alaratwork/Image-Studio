name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install OpenCV and a C++17 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev clang pkg-config

      - name: Build the editor and the search engine
        run: make

      - name: Search the sample library end to end
        run: make demo
